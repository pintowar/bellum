name: Bellum Tag Release Workflow CI
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag to release'
        required: true

env:
  JAVA_VERSION: '25'
  JAVA_DISTRO: 'graalvm'

jobs:
  build-native:
    name: Build Native - ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            artifact_name: bellum
          - os: macos-latest
            platform: osx-aarch64
            artifact_name: bellum
          - os: windows-latest
            platform: windows-x86_64
            artifact_name: bellum.exe

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag }}
          fetch-depth: 0

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRO }}
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build native executable
        run: ./gradlew clean nativeCompile

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: build/native/nativeCompile/${{ matrix.artifact_name }}
          retention-days: 1

  release:
    name: Create Release
    needs: build-native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag }}
          fetch-depth: 0

      - uses: n1hility/cancel-previous-runs@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRO }}
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: build/native/nativeCompile/

      - name: Package artifacts for JReleaser
        run: |
          echo "=== Downloaded artifacts ==="
          ls -la build/native/nativeCompile/

          # Create archive directory
          mkdir -p build/native/archives

          # Linux
          if [ -d "build/native/nativeCompile/linux-x86_64" ]; then
            tar -czf build/native/archives/bellum-linux-x86_64.tar.gz -C build/native/nativeCompile/linux-x86_64 bellum
          fi

          # macOS (aarch64 in matrix, aarch_64 for JReleaser)
          if [ -d "build/native/nativeCompile/osx-aarch64" ]; then
            tar -czf build/native/archives/bellum-osx-aarch_64.tar.gz -C build/native/nativeCompile/osx-aarch64 bellum
          fi

          # Windows
          if [ -d "build/native/nativeCompile/windows-x86_64" ]; then
            zip -j build/native/archives/bellum-windows-x86_64.zip build/native/nativeCompile/windows-x86_64/bellum.exe
          fi

          echo ""
          echo "=== Final archives ==="
          ls -la build/native/archives/

      - name: Copy archives to nativeCompile for JReleaser
        run: |
          cp build/native/archives/* build/native/nativeCompile/
          rm -rf build/native/nativeCompile/linux-x86_64 \
                 build/native/nativeCompile/osx-aarch64 \
                 build/native/nativeCompile/windows-x86_64

      - name: Create GitHub Release
        run: ./gradlew jreleaserRelease
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
