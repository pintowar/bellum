name: Bellum Release Draft CI
on:
  push:
    branches:
      - 'release/*'

env:
  JAVA_VERSION: '25'
  JAVA_DISTRO: 'graalvm'

jobs:
  build-native:
    name: Build Native - ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            artifact_name: bellum
          - os: macos-latest
            platform: osx-aarch64
            artifact_name: bellum
          - os: windows-latest
            platform: windows-x86_64
            artifact_name: bellum.exe

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/heads/release/}" >> $GITHUB_OUTPUT

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRO }}
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build native executable
        run: ./gradlew clean nativeCompile

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: build/native/nativeCompile/${{ matrix.artifact_name }}
          retention-days: 1

  create-draft-release:
    name: Create Draft Release
    needs: build-native
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/heads/release/}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: build/native/nativeCompile/

      - name: Package artifacts
        run: |
          mkdir -p build/native/archives

          # Linux
          if [ -d "build/native/nativeCompile/linux-x86_64" ]; then
            tar -czf build/native/archives/bellum-linux-x86_64.tar.gz -C build/native/nativeCompile/linux-x86_64 bellum
          fi

          # macOS
          if [ -d "build/native/nativeCompile/osx-aarch64" ]; then
            tar -czf build/native/archives/bellum-osx-aarch_64.tar.gz -C build/native/nativeCompile/osx-aarch64 bellum
          fi

          # Windows
          if [ -d "build/native/nativeCompile/windows-x86_64" ]; then
            zip -j build/native/archives/bellum-windows-x86_64.zip build/native/nativeCompile/windows-x86_64/bellum.exe
          fi

          rm -rf build/native/nativeCompile/linux-x86_64 \
                 build/native/nativeCompile/osx-aarch64 \
                 build/native/nativeCompile/windows-x86_64

          cp build/native/archives/* build/native/nativeCompile/

      - name: Create Draft Release
        run: |
          cd build/native/nativeCompile/

          gh release create "v${{ steps.version.outputs.VERSION }}" \
            --draft \
            --title "v${{ steps.version.outputs.VERSION }}" \
            --notes "Draft release for version ${{ steps.version.outputs.VERSION }}"

          for artifact in bellum-*; do
            gh release upload "v${{ steps.version.outputs.VERSION }}" "$artifact" --clobber
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
